# Unbind vim-tmux-navigator Ctrl-j / Ctrl-k so apps receive them (e.g. pi newline)
unbind-key -n C-j
unbind-key -n C-k
unbind-key -T copy-mode-vi C-j
unbind-key -T copy-mode-vi C-k

# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w90% -h90% -E lazygit

# Run Opencode in a separate session
bind -r y run-shell '\
  SESSION="pi-$(printf "%s" "#{pane_current_path}" | md5sum | cut -c1-8)"; \
  tmux -L pi new-session -Ad -s "$SESSION" -c "#{pane_current_path}" "zsh -lic '\''pi'\''"; \
  tmux -L pi bind-key -T prefix y detach-client; \
  tmux display-popup -w90% -h90% -E "tmux -L pi attach-session -t $SESSION"'
