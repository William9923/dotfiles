# Set default shell as zsh 
set -g default-shell /bin/zsh

set-option -g history-limit 3000

# Enable modified key reporting (fixes Enter/other modified keys in tools like pi)
set -g extended-keys on
set -g extended-keys-format csi-u

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

source ~/.config/tmux/keybind.conf
source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf

if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# ponytail: keep vim-tmux-navigator, but free Ctrl-j/Ctrl-k for apps (pi/newline, etc.)
set -g @vim_navigator_mapping_down ''
set -g @vim_navigator_mapping_up ''

run '~/.tmux/plugins/tpm/tpm'

# utility.conf is sourced AFTER `run tpm` so our custom bindings (e.g. `y`)
# take precedence over plugin defaults. tmux-yank, for example, claims
# `prefix y` for copy-line — sourcing this earlier would let the plugin
# silently overwrite our binding.
source ~/.config/tmux/utility.conf
