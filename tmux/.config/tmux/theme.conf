# Kanagawa Dragon theme for tmux via @theme_* variables.
# Source: ~/.config/theme/kanagawa-dragon/palette.zsh
#
# Colors mapped to tmux user variables for use in status line, borders, etc.
# Reference via #{@theme_bg}, #{@theme_fg}, etc.

# Base colors
set -g @theme_dim '#0d0c0c'
set -g @theme_bg '#181616'
set -g @theme_fg '#c5c9c5'
set -g @theme_muted '#a6a69c'

# Accent colors
set -g @theme_red '#c4746e'
set -g @theme_green '#8a9a7b'
set -g @theme_yellow '#c4b28a'
set -g @theme_blue '#8ba4b0'
set -g @theme_magenta '#a292a3'
set -g @theme_cyan '#8ea4a2'
set -g @theme_orange '#b6927b'
set -g @theme_violet '#938aa9'
set -g @theme_white '#c8c093'

# Semantic aliases
set -g @theme_active '#c5c9c5'
set -g @theme_inactive '#0d0c0c'
set -g @theme_selection '#a6a69c'
set -g @theme_comment '#0d0c0c'
set -g @theme_error '#c4746e'
set -g @theme_warning '#c4b28a'
set -g @theme_info '#8ba4b0'
set -g @theme_hint '#8a9a7b'

# Highlight colors (brighter variants for emphasis)
set -g @theme_red_bright '#ff657a'
set -g @theme_green_bright '#98bb6c'
set -g @theme_yellow_bright '#e6c384'
set -g @theme_blue_bright '#7fb4ca'
set -g @theme_magenta_bright '#b39ec3'
set -g @theme_cyan_bright '#6fc0b2'
